# Render Blueprint (FREE plan): the API only. The web interface is hosted on Vercel; see docs/DEPLOYMENT.md.
#
# Free services only: a free web service plus Render's free PostgreSQL. The web service has no persistent disk and
# sleeps after 15 idle minutes, so uploaded ORIGINAL FILES, the vector index and the trained model live under /tmp and
# reset whenever it restarts or wakes. The database persists: users, documents, extracted text, classifications,
# reviews and the audit log survive. start.sh rebuilds the rest on every start (admin if missing, classifier, vector
# index from the stored text, demo documents). Search keeps working; the original file of an uploaded document is
# gone after a restart (download and reprocess say so).
# LIMIT: Render deletes a free database 30 days after creation plus a 14-day grace period; only one free database is
# allowed per workspace and there are no backups. For durable data use render.paid.yaml (needs a card).
#
# Ollama cannot run on Render, so the AI assistant and neural semantic embeddings are OFF here (keyword + lexical
# search, classification, entities, analytics and the rest work).
databases:
  - name: infomind-db
    plan: free                  # expires 30 days after creation (14-day grace, then deleted), 1 GB, no backups
    databaseName: infomind
    user: infomind
    postgresMajorVersion: "16"

services:
  - type: web
    name: infomind-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    numInstances: 1           # the embedded vector store requires a single instance
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ENABLE_REGISTRATION
        value: "false"          # nobody can self-register on a public URL; the admin creates users
      - key: CORS_ORIGINS
        value: https://infomind-ai-enterprise.vercel.app
      - key: FORWARDED_ALLOW_IPS
        value: "*"              # trust Render's proxy so per-IP rate limits see the real client address
      - key: DATA_DIR
        value: /tmp/infomind    # created at start-up and handed to the unprivileged app user
      - key: DATABASE_URL
        fromDatabase:           # Render's free PostgreSQL: users, documents, text, results and audit survive restarts
          name: infomind-db
          property: connectionString
      - key: AUTO_REINDEX
        value: "true"           # the vector index lives on temporary storage: rebuild it from the stored text at start
      - key: STORAGE_DIR
        value: /tmp/infomind/uploads
      - key: MODEL_DIR
        value: /tmp/infomind/models
      - key: QDRANT_URL
        value: path:/tmp/infomind/qdrant
      - key: EMBEDDING_PROVIDER
        value: hash
      - key: EMBEDDING_DIMENSIONS
        value: "256"
      - key: RUN_WORKER_IN_API
        value: "true"
      - key: AUTO_TRAIN
        value: "true"
      - key: SEED_DEMO
        value: "true"           # synthetic demo documents, recreated on every start
      - key: INITIAL_ADMIN_EMAIL
        sync: false             # you are prompted for this when you create the Blueprint
      - key: INITIAL_ADMIN_PASSWORD
        sync: false             # at least 10 characters; choose a NEW password, not one used elsewhere
