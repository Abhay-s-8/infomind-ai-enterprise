# Render Blueprint (FREE plan): the API only. The web interface is hosted on Vercel; see docs/DEPLOYMENT.md.
#
# No card is needed for this file. The trade-off: a free instance has no persistent disk and sleeps when idle, so the
# database, uploads, vectors and trained model live under /tmp and RESET whenever the instance restarts or wakes.
# start.sh rebuilds the essentials on every start (migration, admin, classifier, synthetic demo documents), so the
# app is always in a consistent state, but anything uploaded or created in the UI is lost. For persistent data add a
# payment method in Render and use render.paid.yaml instead (choose it as the Blueprint file path).
#
# Ollama cannot run on Render, so the AI assistant and neural semantic embeddings are OFF here (keyword + lexical
# search, classification, entities, analytics and the rest work).
services:
  - type: web
    name: infomind-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    numInstances: 1           # the embedded vector store requires a single instance
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ENABLE_REGISTRATION
        value: "false"          # nobody can self-register on a public URL; the admin creates users
      - key: CORS_ORIGINS
        value: https://infomind-ai-enterprise.vercel.app
      - key: FORWARDED_ALLOW_IPS
        value: "*"              # trust Render's proxy so per-IP rate limits see the real client address
      - key: DATA_DIR
        value: /tmp/infomind    # created at start-up and handed to the unprivileged app user
      - key: DATABASE_URL
        value: sqlite:////tmp/infomind/infomind.db
      - key: STORAGE_DIR
        value: /tmp/infomind/uploads
      - key: MODEL_DIR
        value: /tmp/infomind/models
      - key: QDRANT_URL
        value: path:/tmp/infomind/qdrant
      - key: EMBEDDING_PROVIDER
        value: hash
      - key: EMBEDDING_DIMENSIONS
        value: "256"
      - key: RUN_WORKER_IN_API
        value: "true"
      - key: AUTO_TRAIN
        value: "true"
      - key: SEED_DEMO
        value: "true"           # synthetic demo documents, recreated on every start
      - key: INITIAL_ADMIN_EMAIL
        sync: false             # you are prompted for this when you create the Blueprint
      - key: INITIAL_ADMIN_PASSWORD
        sync: false             # at least 10 characters; choose a NEW password, not one used elsewhere
