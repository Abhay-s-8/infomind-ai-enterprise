# Postgres + Qdrant + API + worker + frontend dev server.
# Ollama is NOT included: run it natively on Windows (GPU access) and the containers reach it at
# http://host.docker.internal:11434. Do not assume localhost inside a container is the Windows host.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: infomind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: infomind
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infomind"]
      interval: 5s
      retries: 10
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"]  # set POSTGRES_HOST_PORT if 5432 is taken on the host

  qdrant:
    image: qdrant/qdrant:v1.12.4
    volumes: [qdrantdata:/qdrant/storage]
    ports: ["127.0.0.1:6333:6333"]

  backend: &backend
    build: ./backend
    environment: &backend-env
      ENVIRONMENT: development
      # If the password contains URL-reserved characters (@ : / %), set DATABASE_URL in .env with it percent-encoded.
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://infomind:${POSTGRES_PASSWORD}@postgres:5432/infomind}
      QDRANT_URL: http://qdrant:6333
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-llama3.2:3b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      DEV_ADMIN_EMAIL: ${DEV_ADMIN_EMAIL:-}
      DEV_ADMIN_PASSWORD: ${DEV_ADMIN_PASSWORD:-}
      CORS_ORIGINS: http://localhost:5173
      STORAGE_DIR: /data/uploads
      MODEL_DIR: /data/models
      RUN_WORKER_IN_API: "false"
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: [appdata:/data]
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_started}
    ports: ["127.0.0.1:8000:8000"]

  worker:
    <<: *backend
    command: ["python", "-m", "app.workers.worker"]
    ports: []
    depends_on: [backend]

  frontend:
    build: ./frontend
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    depends_on: [backend]
    ports: ["127.0.0.1:5173:5173"]

volumes:
  pgdata:
  qdrantdata:
  appdata:
